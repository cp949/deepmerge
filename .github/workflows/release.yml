name: Release

# v* 태그 push에서 @cp949/deepmerge를 npm에 배포한다.
# npm 토큰 없이 trusted publishing(OIDC)으로 인증한다. npmjs.com 패키지 설정의 trusted publisher에
# 저장소 cp949/deepmerge와 이 파일명(release.yml)이 등록돼 있어야 한다. 파일명을 바꾸면 등록도 바꾼다.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # master 포함 여부를 확인하려면 전체 이력이 필요하다.
          fetch-depth: 0

      # trusted publishing은 npm CLI 11.5.1 이상이 필요하다. Node 24에 번들된 npm을 쓴다.
      # registry-url은 지정하지 않는다. 지정하면 토큰 자리표시자가 담긴 .npmrc가 만들어져 OIDC 인증을 가린다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # master에 병합되지 않은 커밋의 태그는 배포하지 않는다.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      # 태그와 package.json 버전이 다르면 배포하지 않는다.
      - run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      # prepublishOnly(npm test)가 빌드와 테스트를 실행한다.
      - run: npm publish --provenance --access public
